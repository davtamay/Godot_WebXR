<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebXR WebGL Matrix</title>
  <style>
    body {
      margin: 0;
      background: #101014;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    button { display: block; margin: 10px 0; padding: 12px 16px; border: 0; border-radius: 8px; font-weight: 700; }
    pre { white-space: pre-wrap; background: #18181b; border: 1px solid #3f3f46; border-radius: 8px; padding: 12px; }
    canvas { width: 100%; max-width: 480px; aspect-ratio: 16 / 9; display: block; background: #000; }
  </style>
</head>
<body>
  <main>
    <h1>WebXR WebGL Matrix</h1>
    <button data-mode="webgl">Try WebGL 1</button>
    <button data-mode="webgl2">Try WebGL 2</button>
    <canvas id="canvas"></canvas>
    <pre id="status">Ready.</pre>
  </main>
  <script>
    const canvas = document.getElementById('canvas');
    const statusEl = document.getElementById('status');

    function log(message) {
      statusEl.textContent += `\n${message}`;
      console.log(message);
    }

    function fail(message, error) {
      const text = `${message}: ${error && error.stack ? error.stack : error}`;
      statusEl.textContent += `\nFAILED: ${text}`;
      console.error(text);
      window.CompanyWebXRMatrixFailure = text;
    }

    async function tryMode(mode) {
      statusEl.textContent = `Trying ${mode}...\nsecureContext=${window.isSecureContext}\ncrossOriginIsolated=${window.crossOriginIsolated}\nnavigator.xr=${!!navigator.xr}`;
      try {
        const gl = canvas.getContext(mode, {
          alpha: false,
          antialias: false,
          depth: true,
          stencil: false,
          xrCompatible: true,
        });
        if (!gl) throw new Error(`${mode} context unavailable`);
        log(`${mode} context created`);

        const supported = await navigator.xr.isSessionSupported('immersive-vr');
        log(`immersive-vr supported=${supported}`);
        if (!supported) throw new Error('immersive-vr unsupported');

        const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
        log('requestSession succeeded');

        if (gl.makeXRCompatible) {
          await gl.makeXRCompatible();
          log('makeXRCompatible succeeded');
        }

        const layer = new XRWebGLLayer(session, gl);
        session.updateRenderState({ baseLayer: layer });
        await session.requestReferenceSpace('local');
        log(`${mode} raw WebXR path succeeded`);

        session.requestAnimationFrame(function draw(_time, frame) {
          const baseLayer = frame.session.renderState.baseLayer;
          gl.bindFramebuffer(gl.FRAMEBUFFER, baseLayer.framebuffer);
          gl.viewport(0, 0, baseLayer.framebufferWidth, baseLayer.framebufferHeight);
          gl.clearColor(mode === 'webgl2' ? 0.0 : 0.0, mode === 'webgl2' ? 0.45 : 0.8, mode === 'webgl2' ? 0.9 : 0.2, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          frame.session.requestAnimationFrame(draw);
        });
      } catch (error) {
        fail(`${mode} failed`, error);
      }
    }

    document.querySelectorAll('button[data-mode]').forEach((button) => {
      button.addEventListener('click', () => tryMode(button.dataset.mode));
    });
  </script>
</body>
</html>
