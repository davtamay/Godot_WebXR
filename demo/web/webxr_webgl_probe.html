<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebXR WebGL Probe</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #101014;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 700;
      background: #38bdf8;
      color: #001018;
    }
    pre {
      white-space: pre-wrap;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 12px;
    }
    canvas {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 16 / 9;
      display: block;
      margin: 16px 0;
      background: #000;
    }
  </style>
</head>
<body>
  <main>
    <h1>WebXR WebGL Probe</h1>
    <p>This page tests raw browser WebXR + WebGL without Godot.</p>
    <button id="enter">Enter Raw WebXR</button>
    <canvas id="canvas"></canvas>
    <pre id="status">Ready.</pre>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const button = document.getElementById('enter');
    const statusEl = document.getElementById('status');
    let gl;
    let session;

    function log(message) {
      statusEl.textContent += `\n${message}`;
      console.log(message);
    }

    function fail(label, error) {
      const message = `${label}: ${error && error.stack ? error.stack : error}`;
      statusEl.textContent += `\n\nFAILED - ${message}`;
      console.error(message);
      window.CompanyRawWebXRFailure = message;
    }

    async function enterXR() {
      button.disabled = true;
      statusEl.textContent = 'Starting raw WebXR probe...';

      try {
        log(`secureContext=${window.isSecureContext}`);
        log(`crossOriginIsolated=${window.crossOriginIsolated}`);
        log(`navigator.xr=${!!navigator.xr}`);

        gl = canvas.getContext('webgl2', {
          alpha: false,
          antialias: false,
          depth: true,
          stencil: false,
          xrCompatible: true,
        });

        if (!gl) {
          throw new Error('webgl2 context is unavailable');
        }
        log(`webgl2 renderer=${gl.getParameter(gl.RENDERER)}`);

        const supported = await navigator.xr.isSessionSupported('immersive-vr');
        log(`immersive-vr supported=${supported}`);
        if (!supported) {
          throw new Error('immersive-vr is not supported');
        }

        session = await navigator.xr.requestSession('immersive-vr', {
          optionalFeatures: ['local-floor', 'bounded-floor'],
        });
        log('requestSession succeeded');

        if (gl.makeXRCompatible) {
          await gl.makeXRCompatible();
          log('makeXRCompatible succeeded');
        } else {
          log('makeXRCompatible not exposed; relying on xrCompatible context attribute');
        }

        const layer = new XRWebGLLayer(session, gl);
        session.updateRenderState({ baseLayer: layer });
        const referenceSpace = await session.requestReferenceSpace('local');
        log('XRWebGLLayer and local reference space ready');

        session.addEventListener('end', () => {
          log('session ended');
          button.disabled = false;
        });

        const drawFrame = (_time, frame) => {
          const xrSession = frame.session;
          const baseLayer = xrSession.renderState.baseLayer;
          gl.bindFramebuffer(gl.FRAMEBUFFER, baseLayer.framebuffer);
          gl.viewport(0, 0, baseLayer.framebufferWidth, baseLayer.framebufferHeight);
          gl.clearColor(0.0, 0.55, 0.9, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          xrSession.requestAnimationFrame(drawFrame);
        };

        session.requestAnimationFrame(drawFrame);
        log('raw WebXR render loop started');
      } catch (error) {
        fail('raw WebXR probe', error);
        button.disabled = false;
      }
    }

    button.addEventListener('click', enterXR);
  </script>
</body>
</html>
